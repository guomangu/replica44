events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;

    # Dynamic domain placeholders replaced at setup (default: localhost / SERVER_DOMAIN)
    # Redirect HTTP to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name _ localhost *.localhost SERVER_DOMAIN *.SERVER_DOMAIN;
        return 301 https://$host:4000$request_uri;
    }

    # Main HTTPS Server (Subpaths & Root Dashboard)
    server {
        listen 4000 ssl;
        listen [::]:4000 ssl;
        server_name localhost *.localhost SERVER_DOMAIN *.SERVER_DOMAIN;

        ssl_certificate     /etc/nginx/certs/replica44.crt;
        ssl_certificate_key /etc/nginx/certs/replica44.key;

        error_page 497 =301 https://$host:$server_port$request_uri;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Landing / Dashboard (Libre d'accès direct)
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
        }

        # Sync API Proxy to VSCode script execution
        location /api/sync {
            auth_basic           "Replica 44 Gateway Access";
            auth_basic_user_file /etc/nginx/htpasswd;
            proxy_pass http://127.0.0.1:8080/;
        }

        # Reverse Proxy Jellyfin (Subpath)
        location /jellyfin/ {
            proxy_pass http://127.0.0.1:8096/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Reverse Proxy Transmission (Subpath)
        location /transmission/ {
            proxy_pass http://127.0.0.1:9091/transmission/;
            proxy_set_header Host 127.0.0.1:9091;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Reverse Proxy VSCode (Subpath)
        location /vscode/ {
            proxy_pass http://127.0.0.1:8080/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_read_timeout 86400;
        }
    }

    # Subdomain Server: Jellyfin (jellyfin.domain.com)
    server {
        listen 4000 ssl;
        listen [::]:4000 ssl;
        server_name jellyfin.localhost jellyfin.SERVER_DOMAIN;

        ssl_certificate     /etc/nginx/certs/replica44.crt;
        ssl_certificate_key /etc/nginx/certs/replica44.key;

        error_page 497 =301 https://$host:$server_port$request_uri;

        location / {
            proxy_pass http://127.0.0.1:8096/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Subdomain Server: Transmission (transmission.domain.com)
    server {
        listen 4000 ssl;
        listen [::]:4000 ssl;
        server_name transmission.localhost transmission.SERVER_DOMAIN;

        ssl_certificate     /etc/nginx/certs/replica44.crt;
        ssl_certificate_key /etc/nginx/certs/replica44.key;

        error_page 497 =301 https://$host:$server_port$request_uri;

        location / {
            proxy_pass http://127.0.0.1:9091/;
            proxy_set_header Host 127.0.0.1:9091;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Subdomain Server: VSCode (vscode.domain.com)
    server {
        listen 4000 ssl;
        listen [::]:4000 ssl;
        server_name vscode.localhost vscode.SERVER_DOMAIN;

        ssl_certificate     /etc/nginx/certs/replica44.crt;
        ssl_certificate_key /etc/nginx/certs/replica44.key;

        error_page 497 =301 https://$host:$server_port$request_uri;

        location / {
            proxy_pass http://127.0.0.1:8080/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_read_timeout 86400;
        }
    }
}
